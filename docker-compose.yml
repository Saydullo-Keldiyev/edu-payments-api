# Full stack in Docker: PostgreSQL + migrations + API + admin UI.
#
#   cp .env.example .env          # then set a password
#   docker compose up --build     # UI: http://localhost:3000, API: http://localhost:4000
#   docker compose --profile test run --rm test   # integration tests inside Docker
#
# Credentials come only from .env (see .env.example); compose refuses to start without them.
name: edu-payments

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (copy .env.example)}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (copy .env.example)}

x-database-url: &database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: *db-env
    # No published port: only the other containers reach the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies Prisma migrations, then exits. The API starts only after it succeeds.
  migrate:
    build:
      context: ./backend
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: *database-url
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        # Called by the browser, so it is the API address as seen from the host machine.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Integration tests against a separate database (<POSTGRES_DB>_test) on the same server.
  # Not started by `docker compose up`; run with: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: build
    command: ["npx", "vitest", "run"]
    environment:
      DATABASE_URL: *database-url
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
